name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Publish Release Artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: |
          cargo test --workspace
          (cd macOS/AgentWatch && swift test)

      - name: Build and Package Release App & CLI
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: ./scripts/package_app.sh

      - name: Verify Bundle
        run: |
          test -x dist/AgentWatch.app/Contents/MacOS/AgentWatch
          test -x dist/AgentWatch.app/Contents/MacOS/aw
          codesign --verify --deep --strict dist/AgentWatch.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/AgentWatch.app/Contents/Info.plist

      - name: Create Archives & Checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          mkdir -p release
          # ditto preserves macOS bundle metadata, symlinks and code signatures (zip -r does not).
          ditto -c -k --sequesterRsrc --keepParent dist/AgentWatch.app "release/AgentWatch-${VERSION}-macOS-${ARCH}.zip"
          cp target/release/aw "release/aw-${VERSION}-darwin-${ARCH}"
          tar -C target/release -czf "release/aw-${VERSION}-darwin-${ARCH}.tar.gz" aw
          cd release
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
